services:
  aammii:
    build: .
    image: aammii:latest
    container_name: aammii
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./orders:/app/orders
      - ./logs:/app/logs
      - aammii_db:/app/db
    environment:
      - HOST=0.0.0.0
      - PORT=5000

volumes:
  aammii_db:
